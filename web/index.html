<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mdict</title>
    <meta name="description" content="Browse MDict dictionaries with working pronunciation audio and in-app cross-references." />
    <!-- Inlined so it needs no route of its own: `serve --web` only handles /,
         /index.html and /assets/*, leaving every other path to the dictionary
         asset fallback. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238c4a2f'/%3E%3Cpath d='M8 8.5h6.2c1.5 0 2.6.7 2.8 1.7v13c-.5-.8-1.5-1.3-2.8-1.3H8Zm16 0h-6.2c-1.5 0-2.6.7-2.8 1.7v13c.5-.8 1.5-1.3 2.8-1.3H24Z' fill='%23faf8f5'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong palette. svelte-widgets/theme stores its choice under the bare key
      // `theme` as one of light | dark | system, and writes the resolved value to
      // <html data-theme> plus style.colorScheme — mirror that exactly here.
      ;(() => {
        try {
          const mode = localStorage.getItem('theme') || 'system'
          const dark =
            mode === 'dark' ||
            (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          const el = document.documentElement
          el.dataset.theme = dark ? 'dark' : 'light'
          el.style.colorScheme = el.dataset.theme
        } catch {
          /* private mode or a disabled store: the app still works in memory */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
