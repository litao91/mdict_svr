[package]
name = "mdict_svr"
version = "0.1.0"
edition = "2021"
description = "Import MDict (.mdx/.mdd) dictionaries into a packed, mmap'd search index and serve lookups over HTTP as HTML or Markdown."
license = "MIT"

[lib]
name = "mdict_svr"
path = "src/lib.rs"

[[bin]]
name = "mdict_svr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
axum = "0.8"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MDX parsing
flate2 = "1"          # zlib record/key blocks
encoding_rs = "0.8"   # UTF-16LE / GB18030 header + key decoding
ripemd = "0.2"        # RIPEMD128 for the v2 encrypted index
adler32 = "1.2"       # header/index checksums

# packed container
memmap2 = "0.9"

# HTML -> Markdown at query time. html5ever's tree builder is reused directly so
# the converter can be tailored to dictionary markup; rcdom gives the DOM.
html5ever = "0.39"
markup5ever_rcdom = "0.39"

# resource content types
mime_guess = "2"

[profile.release]
lto = true
codegen-units = 1
